services:
  mysql:
    image: mysql:8.0
    container_name: core-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - core-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared-services

  redis:
    image: redis:7-alpine
    container_name: core-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shared-services

  proxy:
    build:
      context: ./proxy
    image: core-proxy:local
    container_name: core-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      # One directory per intercepted domain; the directory name is the domain.
      - ./proxy/sites:/srv/sites:ro
      # Generated CA + leaf certificates, kept on the host so the CA survives
      # restarts and can be installed into your trust store.
      - ./proxy/certs:/etc/nginx/certs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/_core_health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - shared-services

networks:
  shared-services:
    name: shared-services
    driver: bridge

volumes:
  core-mysql-data:
    driver: local
